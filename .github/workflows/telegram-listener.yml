name: Telegram Listener

on:
  schedule:
    - cron: '* * * * *'

  workflow_dispatch:

jobs:
  escuchar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: pip install requests

      - name: Verificar Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          python - << 'EOF'
          import requests
          import os

          token = os.environ["BOT_TOKEN"]

          r = requests.get(
              f"https://api.telegram.org/bot{token}/getUpdates"
          )

          datos = r.json()

          ultimo = datos["result"][-1]

          texto = ultimo["message"]["text"]

          print("Mensaje recibido:")
          print(texto)

          partes = texto.split()

          if len(partes) >= 3:

              actividad = partes[1].upper()
              hora = partes[2]

              print("Actividad:", actividad)
              print("Hora:", hora)
          EOF
