name: Telegram Listener

on:
  schedule:
    # Lunes a sábado - cada 30 minutos
    # 08:15 a 19:45 (hora Argentina)
    - cron: '15,45 11-22 * * 1-6'

  workflow_dispatch:

jobs:
  escuchar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar requests
        run: pip install requests

      - name: Verificar Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_TOKEN_PAT: ${{ secrets.TOKEN_GITHUB_PAT }}
        run: |
          python - << 'EOF'
          import requests
          import os

          token = os.environ["BOT_TOKEN"]

          r = requests.get(
              f"https://api.telegram.org/bot{token}/getUpdates"
          )

          datos = r.json()

          if not datos["result"]:
            print("No hay mensajes nuevos.")
            raise SystemExit(0)

          ultimo = datos["result"][-1]

          update_id = ultimo["update_id"]
          texto = ultimo["message"]["text"]

          chat_id = ultimo["message"]["chat"]["id"]

          print("Chat ID:", chat_id)

          print("Mensaje recibido:")
          print(texto)

          # Confirmar el mensaje para no volver a procesarlo
          requests.get(
            f"https://api.telegram.org/bot{token}/getUpdates",
            params={
              "offset": update_id + 1
            }
          )

          partes = texto.split()

          if len(partes) >= 3:

            hora = partes[-1]

            actividad = " ".join(
              partes[1:-1]
            ).upper()

            print("Actividad:", actividad)
            print("Hora:", hora)
                        
            github_token = os.environ["GITHUB_TOKEN_PAT"]
                              
            respuesta = requests.post(
                "https://api.github.com/repos/spinosoagustin-tech/uno-reservas/actions/workflows/reserva.yml/dispatches",
                headers={
                    "Authorization": f"Bearer {github_token}",
                    "Accept": "application/vnd.github+json"
                },
                json={
                    "ref": "main",
                    "inputs": {
                        "actividad": actividad,
                        "hora": hora,
                        "chat_id": str(chat_id)
                    }
                }
            )
            
            print("Status:", respuesta.status_code)
            print("Respuesta:")
            print(respuesta.text)          
                
          EOF
